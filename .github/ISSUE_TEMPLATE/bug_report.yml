name: Bug report
description: Something in ha-axi does not work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste Long-Lived Access Tokens**, passwords, or private home entity data.
  - type: input
    id: cli-version
    attributes:
      label: ha-axi version
      description: Output of `ha-axi --version`
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version` (22+ required)
      placeholder: v22.x
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: From `ha-axi doctor` or HA settings (optional if doctor cannot connect)
      placeholder: 2026.10.x
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands (sanitize entity ids if needed)
      placeholder: |
        1. export HA_URL=...
        2. ha-axi doctor
        3. ha-axi state list --domain light --limit 5
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste sanitized CLI output. Redact tokens and private names.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: `ha-axi doctor` output (sanitized)
      description: Replace real hostnames/IPs with placeholders if you prefer
    validations:
      required: false
