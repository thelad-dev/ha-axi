name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  # Provenance attestations need OIDC to Sigstore even when npm auth uses a token.
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Staged publishing needs Node >= 22.14 and npm CLI >= 11.15.0.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports staged publishing
        run: npm install -g npm@^11.15.0 && npm --version && node --version

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Stage only — no 2FA. Approval is on npmjs.com with Passkey.
      # Works for brand-new packages (registry creates placeholder 0.0.0-stage).
      - name: Stage package on npm
        run: npm stage publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
